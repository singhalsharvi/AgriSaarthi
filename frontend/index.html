<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriSaarthi — Digital Companion for Indian Farmers</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --color-forest-green: #1B4D2E;
      --color-forest-green-dark: #12361F;
      --color-leaf-green: #2D6A3F;
      --color-leaf-light: #E8F2EC;
      --color-mitti-brown: #6E4723;
      --color-mitti-light: #F4ECE3;
      --color-terracotta: #C85A32;
      --color-terracotta-light: #F9ECE7;
      --color-mustard: #DA9B26;
      --color-wheat-gold: #E5B842;
      --color-wheat-light: #FCF5E3;
      --color-cream-bg: #FDFBF7;
      --color-cream-surface: #F6F2EA;
      --color-cream-border: #E5DDD0;
      --color-charcoal: #1A1C19;
      --color-charcoal-muted: #525750;
      --color-white: #FFFFFF;
      --font-primary: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Outfit', sans-serif;
      --sidebar-width: 280px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 2px 6px rgba(27, 77, 46, 0.04);
      --shadow-md: 0 4px 16px rgba(27, 77, 46, 0.08);
      --shadow-lg: 0 12px 32px rgba(27, 77, 46, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-primary); background-color: var(--color-cream-bg); color: var(--color-charcoal); line-height: 1.6; }
    h1, h2, h3, h4 { font-family: var(--font-heading); color: var(--color-forest-green-dark); }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    .app-container { display: flex; min-height: 100vh; }
    .main-content { flex: 1; margin-left: var(--sidebar-width); min-height: 100vh; display: flex; flex-direction: column; }
    .page-container { flex: 1; padding: 2.5rem; max-width: 1280px; margin: 0 auto; width: 100%; }
    .desi-card { background: var(--color-white); border: 1.5px solid var(--color-cream-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; transition: all 0.2s ease; }
    .desi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn-primary { background-color: var(--color-forest-green); color: white; padding: 0.85rem 1.75rem; border-radius: var(--radius-full); font-weight: 700; display: inline-flex; align-items: center; gap: 0.5rem; }
    .btn-secondary { background-color: var(--color-cream-surface); color: var(--color-mitti-brown); border: 1.5px solid var(--color-cream-border); padding: 0.85rem 1.75rem; border-radius: var(--radius-full); font-weight: 700; }
    .badge-desi { background-color: var(--color-leaf-light); color: var(--color-forest-green); padding: 0.35rem 0.85rem; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 700; }
    .form-input, .form-select { width: 100%; padding: 0.85rem 1.1rem; border: 1.5px solid var(--color-cream-border); border-radius: var(--radius-md); font-size: 1rem; background: var(--color-white); }

    @media (max-width: 1024px) {
      .main-content { margin-left: 0; padding-top: 64px; padding-bottom: 64px; }
      .desktop-sidebar { display: none !important; }
      .mobile-header { display: flex !important; }
      .mobile-bottom-nav { display: flex !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    // Vite forwards /api to the FastAPI server, avoiding browser CORS/address issues.
    const API_BASE_URL = window.location.port === '3000'
      ? '/api'
      : `http://${window.location.hostname || '127.0.0.1'}:8000`;

    const TRANSLATIONS = {

      },
      hi: {

        brandPhrase: "अपनी फसल। अपना फैसला।",
        heroTitle: "आपका खेत। आपका भविष्य। आपका सारथी।",
        heroSub: "फसलों, पौधों के स्वास्थ्य और सरकारी सहायता के लिए स्मार्ट कृषि मार्गदर्शन — एक ही स्थान पर।",
        getStarted: "शुरू करें",
        exploreFeatures: "विशेषताएं देखें",
        navHome: "मुख्य पृष्ठ",
        navFeatures: "विशेषताएं",
        navAbout: "हमारे बारे में",
        navCrop: "फसल सिफारिश",
        navDisease: "पौधों की बीमारी की जांच",
        navSchemes: "सरकारी योजनाएं",
        navDashboard: "किसान डैशबोर्ड",
        navHelp: "सहायता",
        navSignIn: "साइन इन",
        chooseLang: "भाषा चुनें"
      },
      bn: {
        brand: "কৃষি সারথী",
        tagline: "আপনার জমি। আপনার ভবিষ্যৎ। আপনার সারথী।",
        brandPhrase: "নিজের ফসল। নিজের সিদ্ধান্ত।",
        heroTitle: "আপনার জমি। আপনার ভবিষ্যৎ। আপনার সারথী।",
        heroSub: "ফসল, গাছের স্বাস্থ্য এবং সরকারি সহায়তার জন্য স্মার্ট কৃষি নির্দেশিকা — এক জায়গায়।",
        getStarted: "শুরু করুন",
        exploreFeatures: "বৈশিষ্ট্যসমূহ দেখুন",
        navHome: "হোম",
        navFeatures: "বৈশিষ্ট্যসমূহ",
        navAbout: "আমাদের কথা",
        navCrop: "ফসল সুপারিশ",
        navDisease: "রোগ সনাক্তকরণ",
        navSchemes: "সরকারি প্রকল্প",
        navDashboard: "কৃষক ড্যাশবোর্ড",
        navHelp: "সাহায্য",
        navSignIn: "সাইন ইন",
        chooseLang: "ভাষা নির্বাচন করুন"
      },
      mr: {
        brand: "कृषी सारथी",
        tagline: "तुमची शेती। तुमचे भविष्य। तुमचा सारथी।",
        brandPhrase: "आपली शेती। आपला निर्णय।",
        heroTitle: "तुमची शेती। तुमचे भविष्य। तुमचा सारथी।",
        heroSub: "पिके, वनस्पतींचे आरोग्य आणि सरकारी मदतीसाठी स्मार्ट कृषी मार्गदर्शन — एकाच ठिकाणी।",
        getStarted: "शुरू करा",
        exploreFeatures: "वैशिष्ट्ये पहा",
        navHome: "मुख्य पृष्ठ",
        navFeatures: "वैशिष्ट्ये",
        navAbout: "आमच्याबद्दल",
        navCrop: "पिक सल्ला",
        navDisease: "रोग निदान",
        navSchemes: "शासकीय योजना",
        navDashboard: "शेतकरी डॅशबोर्ड",
        navHelp: "मदत",
        navSignIn: "साइन इन",
        chooseLang: "भाषा निवडा"
      },
      kn: {
        brand: "ಕೃಷಿ ಸಾರಥಿ",
        tagline: "ನಿಮ್ಮ ಹೊಲ. ನಿಮ್ಮ ಭವಿಷ್ಯ. ನಿಮ್ಮ ಸಾರಥಿ.",
        brandPhrase: "ನಮ್ಮ ಬೆಳೆ. ನಮ್ಮ ನಿರ್ಧಾರ.",
        heroTitle: "ನಿಮ್ಮ ಹೊಲ. ನಿಮ್ಮ ಭವಿಷ್ಯ. ನಿಮ್ಮ ಸಾರಥಿ.",
        heroSub: "ಬೆಳೆಗಳು, ಸಸ್ಯಗಳ ಆರೋಗ್ಯ ಮತ್ತು ಸರ್ಕಾರಿ ನೆರವಿಗಾಗಿ ಸ್ಮಾರ್ಟ್ ಕೃಷಿ ಮಾರ್ಗದರ್ಶನ — ಒಂದೇ ಸ್ಥಳದಲ್ಲಿ.",
        getStarted: "ಪ್ರಾರಂಭಿಸಿ",
        exploreFeatures: "ವೈಶಿಷ್ಟ್ಯಗಳನ್ನು ವೀಕ್ಷಿಸಿ",
        navHome: "ಮುಖ್ಯ ಪುಟ",
        navFeatures: "ವೈಶಿಷ್ಟ್ಯಗಳು",
        navAbout: "ನಮ್ಮ ಬಗ್ಗೆ",
        navCrop: "ಬೆಳೆ ಶಿಫಾರಸು",
        navDisease: "ರೋಗ ಪತ್ತೆ",
        navSchemes: "ಸರ್ಕಾರಿ ಯೋಜನೆಗಳು",
        navDashboard: "ರೈತ ಡ್ಯಾಶ್‌ಬೋರ್ಡ್",
        navHelp: "ಸಹಾಯ",
        navSignIn: "ಸೈನ್ ಇನ್",
        chooseLang: "ಭಾಷೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ"
      }
    };

    const LANGUAGES = [
      { code: 'en', native: 'English' },
      { code: 'hi', native: 'हिन्दी' },
      { code: 'bn', native: 'বাংলা' },
      { code: 'mr', native: 'मराठी' },
      { code: 'kn', native: 'ಕನ್ನಡ' }
    ];

    function App() {
      const [lang, setLang] = useState('en');
      const [activeTab, setActiveTab] = useState('welcome');
      const [isLangOpen, setIsLangOpen] = useState(false);
      const [user, setUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem('agri_user')); } catch { return null; }
      });
      const [profileForm, setProfileForm] = useState({ name: '', contact: '', location: '', landSize: '', soilType: '' });
      const [profileLoading, setProfileLoading] = useState(false);
      const [profileError, setProfileError] = useState('');

      // Crop Rec State
      const [cropLoc, setCropLoc] = useState('Meerut, Uttar Pradesh');
      const [cropSeason, setCropSeason] = useState('Kharif');
      const [cropResults, setCropResults] = useState(null);
      const [cropLoading, setCropLoading] = useState(false);
      const [cropError, setCropError] = useState('');

      // Disease State
      const [diseaseImg, setDiseaseImg] = useState(null);
      const [diseaseLoading, setDiseaseLoading] = useState(false);
      const [diseaseResults, setDiseaseResults] = useState(null);
      const [diseaseError, setDiseaseError] = useState('');

      // Schemes State
      const [schemeLocation, setSchemeLocation] = useState('');
      const [schemeAnnualIncome, setSchemeAnnualIncome] = useState('');
      const [schemeGender, setSchemeGender] = useState('prefer_not_to_say');
      const [schemeLandholding, setSchemeLandholding] = useState('1.5');
      const [schemeResults, setSchemeResults] = useState(null);
      const [schemeLoading, setSchemeLoading] = useState(false);
      const [schemeError, setSchemeError] = useState('');

      const t = (key) => (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.en[key] || key;

      const updateProfileField = (field, value) => setProfileForm(current => ({ ...current, [field]: value }));

      const handleProfileSubmit = async (e) => {
        e.preventDefault();
        const profile = {
          name: profileForm.name.trim(),
          emailOrPhone: profileForm.contact.trim(),
          location: profileForm.location.trim(),
          landholding: profileForm.landSize.trim(),
          soilType: profileForm.soilType.trim()
        };
        if (!profile.name || !profile.emailOrPhone || !profile.location || !profile.landholding) {
          setProfileError('Please complete your name, contact, location, and land size.');
          return;
        }
        setProfileLoading(true);
        setProfileError('');
        try {
          const response = await fetch(`${API_BASE_URL}/farmer/profile`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              farmer_id: profile.emailOrPhone,
              name: profile.name,
              location: profile.location,
              contact_info: profile.emailOrPhone,
              land_size: profile.landholding,
              soil_type: profile.soilType
            })
          });
          if (!response.ok) throw new Error('Could not save your profile to the server.');
        } catch (error) {
          // The local copy keeps onboarding usable if the backend starts later.
          console.warn(error.message);
        } finally {
          localStorage.setItem('agri_user', JSON.stringify(profile));
          setUser(profile);
          setProfileLoading(false);
          setActiveTab('home');
        }
      };

      const handleMockCropSubmit = (e) => {
        e.preventDefault();
        setCropLoading(true);
        setCropResults(null);
        setTimeout(() => {
          setCropResults({
            location: cropLoc,
            season: cropSeason,
            soil: "Alluvial Soil (Loam), pH: 6.8",
            confidence: "92.40%",
            crops: [
              { name: "Rice (Paddy)", confidence: "92.40%", reason: "Optimal rainfall (1050mm) and high humidity (68%) match local Alluvial soil during Kharif season.", img: "https://images.unsplash.com/photo-1536657464919-892534f60d6e?auto=format&fit=crop&w=800&q=80" },
              { name: "Maize (Corn)", confidence: "87.15%", reason: "Well-drained loam soil with moderate temperature provides excellent root establishment.", img: "https://images.unsplash.com/photo-1551754655-cd27e38d2076?auto=format&fit=crop&w=800&q=80" },
              { name: "Sugarcane", confidence: "81.90%", reason: "High temperature tolerance and fertile river plain soil support high sucrose yield.", img: "https://images.unsplash.com/photo-1601593346740-925612772716?auto=format&fit=crop&w=800&q=80" }
            ]
          });
          setCropLoading(false);
        }, 1500);
      };

      const handleCropSubmit = async (e) => {
        e.preventDefault();
        const location = cropLoc.trim();
        if (!location) {
          setCropError('Please enter your village, city, or district.');
          return;
        }

        setCropLoading(true);
        setCropResults(null);
        setCropError('');
        try {
          const response = await fetch(`${API_BASE_URL}/crop/recommend`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              location,
              season: cropSeason,
              user_query: `Recommend crops for ${location} during ${cropSeason} based on local weather and soil.`
            })
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || `Server returned HTTP ${response.status}`);
          if (!payload.recommended_crops?.length) {
            throw new Error(payload.warning || 'No suitable crops were found for these conditions.');
          }
          setCropResults({
            location: payload.location,
            season: payload.season,
            soil: payload.soil,
            source: payload.recommendation_source,
            warning: payload.warning,
            explanation: payload.ai_explanation || payload.explanation,
            crops: payload.recommended_crops.map(crop => ({
              name: crop.crop,
              confidence: crop.confidence,
              reason: crop.reason,
              source: crop.source
            }))
          });
        } catch (error) {
          setCropError(`Crop recommendation failed: ${error.message}`);
        } finally {
          setCropLoading(false);
        }
      };

      const handleMockDiseaseSubmit = (e) => {
        e.preventDefault();
        setDiseaseLoading(true);
        setDiseaseResults(null);
        setTimeout(() => {
          setDiseaseResults({
            status: "Tomato — Late Blight (Phytophthora infestans)",
            confidence: "91.80%",
            matches: [
              { name: "Late Blight", conf: "91.8%" },
              { name: "Early Blight", conf: "5.2%" },
              { name: "Healthy Leaf", conf: "3.0%" }
            ],
            symptoms: "Water-soaked dark brown spots with yellow margins on leaf surfaces.",
            treatment: "1. Apply Copper Oxychloride (3g/liter water) or Mancozeb 75 WP (2g/liter).\n2. Remove severely infected foliage and maintain proper field spacing."
          });
          setDiseaseLoading(false);
        }, 1500);
      };

      const handleDiseaseSubmit = async (e) => {
        e.preventDefault();
        if (!diseaseImg) {
          setDiseaseError('Please select a clear plant-leaf image first.');
          return;
        }
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(diseaseImg.type)) {
          setDiseaseError('Please select a JPG, PNG, or WEBP image.');
          return;
        }
        if (diseaseImg.size > 10 * 1024 * 1024) {
          setDiseaseError('Please select an image smaller than 10 MB.');
          return;
        }

        setDiseaseLoading(true);
        setDiseaseResults(null);
        setDiseaseError('');
        const formData = new FormData();
        formData.append('image', diseaseImg, diseaseImg.name);

        try {
          const response = await fetch(`${API_BASE_URL}/disease/analyze`, {
            method: 'POST',
            body: formData
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || `Server returned HTTP ${response.status}`);
          setDiseaseResults({
            status: payload.disease_status,
            confidence: payload.confidence,
            symptoms: payload.confidence_status === 'low'
              ? 'The model could not identify this image with enough confidence.'
              : 'See the verified advisory below for symptoms and management guidance.',
            treatment: payload.ai_explanation || 'Verified information is not available for this result.'
          });
        } catch (error) {
          setDiseaseError(`Disease analysis failed: ${error.message}`);
        } finally {
          setDiseaseLoading(false);
        }
      };

      const handleSchemeSubmit = async (e) => {
        e.preventDefault();
        const location = schemeLocation.trim();
        const annualIncome = Number.parseFloat(schemeAnnualIncome);
        const landholding = Number.parseFloat(schemeLandholding);
        if (!location || !Number.isFinite(annualIncome) || annualIncome < 0 || !Number.isFinite(landholding) || landholding < 0) {
          setSchemeError('Please enter a location, a valid annual income, and a valid land size.');
          return;
        }
        setSchemeLoading(true);
        setSchemeResults(null);
        setSchemeError('');
        try {
          const response = await fetch(`${API_BASE_URL}/government-schemes/recommend`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              location,
              annual_income: annualIncome,
              landholding,
              gender: schemeGender,
              top_k: 5,
              user_query: `Find suitable government schemes for a ${schemeGender.replaceAll('_', ' ')} farmer in ${location} with annual income of Rs. ${annualIncome} and ${landholding} hectares of land.`
            })
          });
          const payload = await response.json();
          if (!response.ok) throw new Error(payload.detail || `Server returned HTTP ${response.status}`);
          setSchemeResults({
            schemes: payload.recommended_schemes || [],
            explanation: payload.ai_explanation || 'Recommendations were generated from your submitted profile.'
          });
        } catch (error) {
          setSchemeError(`Scheme recommendation failed: ${error.message}`);
        } finally {
          setSchemeLoading(false);
        }
        if (false) {
          setSchemeResults([
            { name: "PM-KISAN (Pradhan Mantri Kisan Samman Nidhi)", snippet: "Direct financial support of ₹6,000 per year in 3 equal installments to small & marginal landholding farmers.", site: "https://pmkisan.gov.in", benefits: "₹6,000 / year direct bank transfer" },
            { name: "Pradhan Mantri Fasal Bima Yojana (PMFBY)", snippet: "Comprehensive crop loss insurance against drought, flood, pests and disease outbreaks with low premium rates.", site: "https://pmfby.gov.in", benefits: "1.5% Rabi / 2% Kharif premium coverage" },
            { name: "Kisan Credit Card (KCC) Scheme", snippet: "Provides timely institutional credit at subsidized interest rate of 4% per annum for seeds & fertilizers.", site: "https://kcc.gov.in", benefits: "Subsidized loan up to ₹3 Lakhs at 4%" }
          ]);
          setSchemeLoading(false);
        }
      };

      if (activeTab === 'welcome') {
        return (

                        </div>
                        <div>
                          <label style={{ fontWeight: 700, display: 'block', marginBottom: '0.5rem' }}>Land Size (Hectares)</label>
                          <input type="number" min="0" step="0.1" className="form-input" value={schemeLandholding} onChange={e => setSchemeLandholding(e.target.value)} placeholder="e.g. 1.5" required />
                        </div>
                      </div>
                      <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
                        {schemeLoading ? 'SEARCHING GOVT DATABASE...' : 'FIND MY SCHEMES'}
                      </button>
                    </form>
                  </div>

                  {schemeError && <div role="alert" style={{ marginBottom: '1.5rem', padding: '1rem 1.25rem', borderRadius: 'var(--radius-md)', background: 'var(--color-terracotta-light)', color: 'var(--color-terracotta)', border: '1px solid var(--color-terracotta)' }}>{schemeError}</div>}

                  {schemeResults && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                      <div className="desi-card" style={{ padding: '1.25rem', whiteSpace: 'pre-wrap', color: 'var(--color-charcoal-muted)' }}>{schemeResults.explanation}</div>
                      {schemeResults.schemes.map((s, idx) => (
                        <div key={idx} className="desi-card" style={{ padding: '2rem' }}>
                          <span className="badge-desi" style={{ marginBottom: '0.5rem', display: 'inline-block' }}>Highly Relevant Scheme</span>
                          <h3 style={{ fontSize: '1.4rem', color: 'var(--color-forest-green-dark)', marginBottom: '0.5rem' }}>{s.scheme_name}</h3>
                          <p style={{ fontSize: '0.95rem', color: 'var(--color-charcoal-muted)', marginBottom: '1rem' }}>{s.snippet}</p>
                          <div style={{ background: 'var(--color-cream-surface)', padding: '1rem', borderRadius: 'var(--radius-md)', marginBottom: '1rem' }}>
                            <strong>Source:</strong> {s.source_file || 'Official government scheme information'}
                          </div>
                          <a href={s.site} target="_blank" rel="noreferrer" style={{ color: 'var(--color-forest-green)', fontWeight: 800 }}>Visit Official Portal →</a>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* PAGE 6: DASHBOARD */}
              {activeTab === 'dashboard' && (
                <div>
                  <div className="desi-card" style={{ padding: '2rem', marginBottom: '2rem' }}>
                    <span className="badge-desi" style={{ marginBottom: '0.5rem', display: 'inline-block' }}>📋 Digital Farm Notebook</span>
                    <h1 style={{ fontSize: '2.2rem', color: 'var(--color-forest-green-dark)' }}>Namaste, {user ? user.name : 'Farmer'} 👋</h1>
                    <p style={{ color: 'var(--color-charcoal-muted)' }}>Location: {user?.location || 'Not added yet'} | Land: {user?.landholding || 'Not added yet'}</p>
                    <p style={{ color: 'var(--color-charcoal-muted)', fontSize: '0.9rem', marginTop: '0.4rem' }}>Contact: {user?.emailOrPhone || 'Not added yet'} {user?.soilType ? `| Soil: ${user.soilType}` : ''}</p>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '1.5rem', marginBottom: '2.5rem' }}>
                    <div className="desi-card" style={{ padding: '1.75rem' }}>
                      <h3 style={{ fontSize: '1.1rem', marginBottom: '0.5rem' }}>🌤️ Local Weather</h3>
                      <p style={{ fontSize: '2.5rem', fontWeight: 800, color: 'var(--color-forest-green-dark)', margin: 0 }}>28°C</p>
                      <p style={{ color: 'var(--color-charcoal-muted)', margin: 0 }}>Partly Cloudy | 68% Humidity</p>
                    </div>

                    <div className="desi-card" style={{ padding: '1.75rem' }}>
                      <h3 style={{ fontSize: '1.1rem', marginBottom: '0.5rem' }}>💡 Today’s Farming Tip</h3>
                      <p style={{ fontSize: '0.9rem', color: 'var(--color-charcoal)' }}>"During humid overcast days, inspect paddy field borders closely for leaf blast signs."</p>
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 7: ABOUT US */}
              {activeTab === 'about' && (
                <div className="desi-card" style={{ padding: '3rem' }}>
                  <span className="badge-desi" style={{ marginBottom: '0.75rem', display: 'inline-block' }}>Our Purpose</span>
                  <h1 style={{ fontSize: '2.5rem', color: 'var(--color-forest-green-dark)', marginBottom: '1rem' }}>Built For The People Who Grow Our Food.</h1>
                  <p style={{ fontSize: '1.1rem', color: 'var(--color-charcoal-muted)', lineHeight: 1.7 }}>
                    AgriSaarthi bridges traditional field wisdom with verified agricultural science. Designed cleanly for Indian farmers with multi-language support.
                  </p>
                </div>
              )}

              {/* PAGE 8: HELP */}
              {activeTab === 'help' && (
                <div className="desi-card" style={{ padding: '3rem' }}>
                  <h1 style={{ fontSize: '2.2rem', color: 'var(--color-forest-green-dark)', marginBottom: '1rem' }}>Need Help?</h1>
                  <p style={{ fontSize: '1.1rem', color: 'var(--color-charcoal)', marginBottom: '2rem' }}>📞 Kisan Call Center (Toll-Free): <strong>1800-180-1551</strong></p>
                </div>
              )}

              {/* PAGE 9: SIGN IN */}
              {activeTab === 'signin' && (
                <div style={{ maxWidth: '1040px', margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', borderRadius: '22px', overflow: 'hidden', boxShadow: 'var(--shadow-lg)', border: '1px solid var(--color-cream-border)', background: 'white' }}>
                  <aside style={{ minHeight: '620px', padding: '3rem', color: 'white', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', background: `linear-gradient(145deg, rgba(9,45,25,0.94), rgba(18,54,31,0.76)), url('https://images.unsplash.com/photo-1576528352255-4cedbc4273d3?auto=format&fit=crop&crop=faces,edges&w=1200&q=85') center/cover no-repeat` }}>
                    <div>
                      <div style={{ display: 'inline-flex', alignItems: 'center', gap: '0.6rem', fontWeight: 800, fontSize: '1.25rem' }}><span style={{ width: '38px', height: '38px', borderRadius: '12px', display: 'grid', placeItems: 'center', background: 'rgba(255,255,255,0.14)', border: '1px solid rgba(255,255,255,0.28)' }}>🌾</span> Agri<span style={{ color: '#F7D46B' }}>Saarthi</span></div>
                      <div style={{ marginTop: '4.5rem', color: '#F7D46B', fontSize: '0.76rem', fontWeight: 800, letterSpacing: '0.12em', textTransform: 'uppercase' }}>Step 1 of 1 · Your farm profile</div>
                      <h1 style={{ color: 'white', fontSize: '2.5rem', lineHeight: 1.13, margin: '0.8rem 0 1rem' }}>Let’s understand your farm.</h1>
                      <p style={{ color: 'rgba(255,255,255,0.85)', lineHeight: 1.7, maxWidth: '360px' }}>A few details help AgriSaarthi tailor crop, weather, and scheme guidance around you.</p>
                    </div>
                    <div style={{ display: 'grid', gap: '0.7rem' }}>{['Personalised crop guidance', 'Plant health history', 'Relevant scheme discovery'].map(item => <div key={item} style={{ display: 'flex', gap: '0.6rem', alignItems: 'center', fontSize: '0.88rem', fontWeight: 650 }}><span style={{ color: '#F7D46B' }}>✓</span>{item}</div>)}</div>
                  </aside>
                  <section style={{ padding: 'clamp(2rem, 5vw, 3.5rem)' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.55rem', color: 'var(--color-forest-green)', fontSize: '0.8rem', fontWeight: 800, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: '0.8rem' }}>✦ Set up your account</div>
                    <h2 style={{ fontSize: '2rem', color: 'var(--color-forest-green-dark)', marginBottom: '0.45rem' }}>Create your farmer profile</h2>
                    <p style={{ fontSize: '0.92rem', color: 'var(--color-charcoal-muted)', marginBottom: '1.7rem' }}>Your information remains on this device and can be updated later.</p>
                    <button type="button" onClick={() => { const demo = { name: 'Asha Patil (Demo)', emailOrPhone: 'demo.farmer@agrisaarthi.local', location: 'Nashik, Maharashtra', landholding: '3 Acres', soilType: 'Black Soil', isDemo: true }; localStorage.setItem('agri_user', JSON.stringify(demo)); setUser(demo); setActiveTab('home'); }} style={{ width: '100%', marginBottom: '1.5rem', padding: '0.85rem 1rem', borderRadius: 'var(--radius-md)', border: '1px solid #B8D8BF', background: '#F1F8F2', color: 'var(--color-forest-green-dark)', fontWeight: 800 }}>🌱 Explore with Demo Farm Data <span style={{ fontWeight: 500, color: 'var(--color-charcoal-muted)' }}>— no sign-up needed</span></button>
                    <form onSubmit={handleProfileSubmit}>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(190px, 1fr))', gap: '1rem' }}>
                        <div style={{ gridColumn: '1 / -1' }}><label style={{ fontWeight: 700, display: 'block', marginBottom: '0.35rem' }}>Farmer name</label><input type="text" className="form-input" value={profileForm.name} onChange={e => updateProfileField('name', e.target.value)} placeholder="e.g. Ramesh Kumar" required /></div>
                        <div><label style={{ fontWeight: 700, display: 'block', marginBottom: '0.35rem' }}>Email or phone</label><input type="text" className="form-input" value={profileForm.contact} onChange={e => updateProfileField('contact', e.target.value)} placeholder="Mobile number or email" required /></div>
                        <div><label style={{ fontWeight: 700, display: 'block', marginBottom: '0.35rem' }}>Farm location</label><input type="text" className="form-input" value={profileForm.location} onChange={e => updateProfileField('location', e.target.value)} placeholder="Village/City, State" required /></div>
                        <div><label style={{ fontWeight: 700, display: 'block', marginBottom: '0.35rem' }}>Land size</label><input type="text" className="form-input" value={profileForm.landSize} onChange={e => updateProfileField('landSize', e.target.value)} placeholder="e.g. 1.5 hectares" required /></div>
                        <div><label style={{ fontWeight: 700, display: 'block', marginBottom: '0.35rem' }}>Soil type <span style={{ fontWeight: 500, color: 'var(--color-charcoal-muted)' }}>(optional)</span></label><input type="text" className="form-input" value={profileForm.soilType} onChange={e => updateProfileField('soilType', e.target.value)} placeholder="e.g. Loamy soil" /></div>
                      </div>
                      {profileError && <p role="alert" style={{ color: 'var(--color-terracotta)', margin: '1rem 0 0' }}>{profileError}</p>}
                      <button type="submit" className="btn-primary" disabled={profileLoading} style={{ width: '100%', justifyContent: 'center', marginTop: '1.5rem', padding: '1rem' }}>{profileLoading ? 'SAVING PROFILE...' : 'SAVE PROFILE AND CONTINUE →'}</button>
                    </form>
                  </section>
                </div>
              )}
            </div>

            {/* Footer */}
            <footer style={{ background: 'var(--color-cream-surface)', borderTop: '1px solid var(--color-cream-border)', padding: '2.5rem', marginTop: 'auto' }}>
              <div style={{ maxWidth: '1200px', margin: '0 auto', display: 'flex', flexWrap: 'wrap', justify: 'space-between', gap: '1.5rem' }}>
                <div>
                  <h3 style={{ color: 'var(--color-forest-green-dark)', marginBottom: '0.5rem' }}>🌾 AgriSaarthi</h3>
                  <p style={{ fontSize: '0.9rem', color: 'var(--color-charcoal-muted)' }}>"Technology for Every Farmer. Built with farmers in mind."</p>
                </div>
                <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                  {LANGUAGES.map(l => (
                    <button key={l.code} onClick={() => setLang(l.code)} style={{ padding: '0.35rem 0.75rem', background: 'white', border: '1px solid var(--color-cream-border)', borderRadius: '4px', fontSize: '0.85rem', fontWeight: 700 }}>
                      {l.native}
                    </button>
                  ))}
                </div>
              </div>
            </footer>
          </main>

          {/* Equal 5-Language Selector Modal */}
          {isLangOpen && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100 }} onClick={() => setIsLangOpen(false)}>
              <div style={{ background: 'white', borderRadius: 'var(--radius-lg)', padding: '2rem', width: '90%', maxWidth: '440px' }} onClick={e => e.stopPropagation()}>
                <h2 style={{ fontSize: '1.35rem', marginBottom: '1rem' }}>🌐 Choose Language / भाषा चुनें</h2>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                  {LANGUAGES.map(l => (
                    <button key={l.code} onClick={() => { setLang(l.code); setIsLangOpen(false); }} style={{
                      padding: '0.85rem 1.25rem', borderRadius: 'var(--radius-md)', border: lang === l.code ? '2px solid var(--color-forest-green)' : '1px solid var(--color-cream-border)',
                      background: lang === l.code ? 'var(--color-leaf-light)' : 'white', textAlign: 'left', fontWeight: 700, fontSize: '1.1rem'
                    }}>
                      {l.native} ({l.code.toUpperCase()})
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
