                        {t('getStarted')} →

                      <button onClick={() => setActiveTab('features')} style={{ background: 'rgba(255,255,255,0.15)', color: 'white', border: '1.5px solid rgba(255,255,255,0.4)', padding: '1rem 2rem', borderRadius: 'var(--radius-full)', fontWeight: 700, fontSize: '1rem' }}>
                        {t('exploreFeatures')}
                      </button>
                    </div>
                  </div>

                  {/* 3 Photo Led Feature Direct Links */}
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1.5rem', marginBottom: '3.5rem' }}>
                    {[
                      { id: 'crop', title: 'Know What To Grow', icon: '🌾', desc: 'Find crops suited to your village location, season and soil.', img: 'https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=600&q=80' },
                      { id: 'disease', title: 'Protect Your Crops', icon: '🌿', desc: 'Upload a plant leaf photo and diagnose possible diseases.', img: 'https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&w=600&q=80' },
                      { id: 'schemes', title: 'Know Your Benefits', icon: '🏛️', desc: 'Discover government subsidies and financial support schemes.', img: 'https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=600&q=80' }
                    ].map(item => (
                      <div key={item.id} onClick={() => setActiveTab(item.id)} className="desi-card" style={{ cursor: 'pointer' }}>
                        <div style={{ height: '160px', background: `url('${item.img}') center/cover no-repeat` }} />
                        <div style={{ padding: '1.5rem' }}>
                          <h3 style={{ fontSize: '1.2rem', color: 'var(--color-forest-green-dark)', marginBottom: '0.4rem' }}>{item.icon} {item.title}</h3>
                          <p style={{ fontSize: '0.9rem', color: 'var(--color-charcoal-muted)', marginBottom: '1rem' }}>{item.desc}</p>
                          <span style={{ color: 'var(--color-forest-green)', fontWeight: 800, fontSize: '0.9rem' }}>Open Tool →</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* PAGE 2: FEATURES */}
              {activeTab === 'features' && (
                <div>
                  <h1 style={{ fontSize: '2.4rem', color: 'var(--color-forest-green-dark)', marginBottom: '2rem', fontWeight: 800 }}>Tools Built Around Your Farm</h1>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '2.5rem' }}>
                    {[
                      { id: 'crop', title: 'Crop Recommendation', desc: 'Analyzes village location, Kharif/Rabi/Zaid season, weather history & soil parameters for top 3 matching crops.', icon: '🌾', img: 'https://images.unsplash.com/photo-1592982537447-7440770cbfc9?auto=format&fit=crop&w=800&q=80' },
                      { id: 'disease', title: 'Plant Disease Detection', desc: 'Upload a plant leaf photo and diagnose fungal or bacterial infections with verified ICAR treatment remedies.', icon: '🌿', img: 'https://images.unsplash.com/photo-1625246333195-78d9c38ad449?auto=format&fit=crop&w=800&q=80' },
                      { id: 'schemes', title: 'Government Schemes', desc: 'Find eligible central and state government subsidies (PM-KISAN, PMFBY, KCC) with document requirements.', icon: '🏛️', img: 'https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=800&q=80' }
                    ].map(f => (
                      <div key={f.id} className="desi-card" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))' }}>
                        <div style={{ minHeight: '260px', background: `url('${f.img}') center/cover no-repeat` }} />
                        <div style={{ padding: '2.5rem', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                          <h2 style={{ fontSize: '1.8rem', color: 'var(--color-forest-green-dark)', marginBottom: '0.85rem' }}>{f.icon} {f.title}</h2>
                          <p style={{ fontSize: '1rem', color: 'var(--color-charcoal-muted)', marginBottom: '1.5rem' }}>{f.desc}</p>
                          <button onClick={() => setActiveTab(f.id)} className="btn-primary" style={{ width: 'fit-content' }}>Launch Feature →</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* PAGE 3: CROP RECOMMENDATION */}
              {activeTab === 'crop' && (
                <div>
                  <div className="desi-card" style={{ marginBottom: '2rem' }}>
                    <div style={{ padding: '2rem', background: 'linear-gradient(to right, #1B4D2E, #2D6A3F)', color: 'white' }}>
                      <span className="badge-desi" style={{ color: 'var(--color-wheat-gold)', background: 'rgba(255,255,255,0.2)', marginBottom: '0.5rem', display: 'inline-block' }}>🌾 Crop Advisory</span>
                      <h1 style={{ color: 'white', fontSize: '2rem' }}>Find the Right Crop for Your Farm</h1>
                      <p style={{ color: 'rgba(255,255,255,0.9)' }}>Tell us where you farm and which season you are planning for.</p>
                    </div>
                    <form onSubmit={handleCropSubmit} style={{ padding: '2rem' }}>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '1.5rem', marginBottom: '1.5rem' }}>
                        <div>
                          <label style={{ fontWeight: 700, display: 'block', marginBottom: '0.5rem' }}>Village / City / District</label>
                          <input type="text" className="form-input" value={cropLoc} onChange={e => setCropLoc(e.target.value)} required />
                        </div>
                        <div>
                          <label style={{ fontWeight: 700, display: 'block', marginBottom: '0.5rem' }}>Cropping Season</label>
                          <select className="form-select" value={cropSeason} onChange={e => setCropSeason(e.target.value)}>
                            <option value="Kharif">🌧️ Kharif</option>
                            <option value="Rabi">❄️ Rabi</option>
                            <option value="Zaid">☀️ Zaid</option>
                          </select>
                        </div>
                      </div>
                      <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
                        {cropLoading ? 'ANALYZING FARM CONDITIONS...' : 'ANALYZE MY FARM'}
                      </button>
                    </form>
                  </div>

                  {cropResults && (
                    <div>
                      <h2 style={{ fontSize: '1.6rem', marginBottom: '1.25rem' }}>Top 3 Recommended Crops</h2>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                        {cropResults.crops.map((c, idx) => (
                          <div key={idx} className="desi-card" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))' }}>
                            <div style={{ minHeight: '220px', background: `url('${c.img}') center/cover no-repeat` }} />
                            <div style={{ padding: '1.75rem' }}>
                              <span className="badge-desi" style={{ marginBottom: '0.5rem', display: 'inline-block' }}>#{idx+1} Match — {c.confidence}</span>
                              <h3 style={{ fontSize: '1.6rem', color: 'var(--color-forest-green-dark)', marginBottom: '0.5rem' }}>{c.name}</h3>
                              <p style={{ fontSize: '0.95rem', color: 'var(--color-charcoal-muted)' }}>{c.reason}</p>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* PAGE 4: DISEASE DETECTION */}
              {activeTab === 'disease' && (
                <div>
                  <div className="desi-card" style={{ marginBottom: '2rem' }}>
                    <div style={{ padding: '2rem', background: 'linear-gradient(to right, #1B4D2E, #2D6A3F)', color: 'white' }}>
                      <span className="badge-desi" style={{ color: 'var(--color-wheat-gold)', background: 'rgba(255,255,255,0.2)', marginBottom: '0.5rem', display: 'inline-block' }}>🌿 Crop Diagnostics</span>
                      <h1 style={{ color: 'white', fontSize: '2rem' }}>Check Your Plant’s Health</h1>
                      <p style={{ color: 'rgba(255,255,255,0.9)' }}>Take or upload a clear photo of the affected leaf.</p>
                    </div>
                    <form onSubmit={handleDiseaseSubmit} style={{ padding: '2rem' }}>
                      <div style={{ border: '2px dashed var(--color-cream-border)', borderRadius: 'var(--radius-lg)', padding: '2.5rem', textAlign: 'center', background: 'var(--color-cream-surface)', marginBottom: '1.5rem' }}>
                        <p style={{ fontSize: '1.1rem', fontWeight: 700, color: 'var(--color-forest-green-dark)' }}>📷 Upload Plant Leaf Image</p>
                        <p style={{ fontSize: '0.85rem', color: 'var(--color-charcoal-muted)' }}>Drag & drop or select image from phone gallery</p>
                        <input type="file" onChange={e => setDiseaseImg(e.target.files[0])} style={{ marginTop: '1rem' }} />
                      </div>
                      <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
                        {diseaseLoading ? 'SCANNING LEAF TEXTURE...' : 'ANALYZE PLANT HEALTH'}
                      </button>
                    </form>
                  </div>

                  {diseaseResults && (
                    <div className="desi-card" style={{ padding: '2rem' }}>
                      <span className="badge-desi" style={{ marginBottom: '0.75rem', display: 'inline-block' }}>Match: {diseaseResults.confidence}</span>
                      <h2 style={{ fontSize: '1.8rem', color: 'var(--color-forest-green-dark)', marginBottom: '1rem' }}>{diseaseResults.status}</h2>
                      <h4 style={{ marginBottom: '0.5rem' }}>Observed Symptoms:</h4>
                      <p style={{ marginBottom: '1.5rem', color: 'var(--color-charcoal-muted)' }}>{diseaseResults.symptoms}</p>
                      <h4 style={{ marginBottom: '0.5rem' }}>Recommended Remedies:</h4>
                      <pre style={{ fontFamily: 'inherit', whiteSpace: 'pre-wrap', background: 'var(--color-cream-surface)', padding: '1rem', borderRadius: 'var(--radius-md)' }}>{diseaseResults.treatment}</pre>
                    </div>
                  )}
                </div>
              )}

              {/* PAGE 5: GOVERNMENT SCHEMES */}
              {activeTab === 'schemes' && (
                <div>
                  <div className="desi-card" style={{ marginBottom: '2rem' }}>
                    <div style={{ padding: '2rem', background: 'linear-gradient(to right, #6E4723, #4F3217)', color: 'white' }}>
                      <span className="badge-desi" style={{ color: 'var(--color-wheat-gold)', background: 'rgba(255,255,255,0.2)', marginBottom: '0.5rem', display: 'inline-block' }}>🏛️ Subsidies & Benefits</span>
                      <h1 style={{ color: 'white', fontSize: '2rem' }}>Government Support For Your Farm</h1>
                      <p style={{ color: 'rgba(255,255,255,0.9)' }}>Find schemes and benefits relevant to your land and crops.</p>
                    </div>
                    <form onSubmit={handleSchemeSubmit} style={{ padding: '2rem' }}>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '1.25rem', marginBottom: '1.5rem' }}>
                        <div>
                          <label style={{ fontWeight: 700, display: 'block', marginBottom: '0.5rem' }}>State</label>
                          <select className="form-select" value={schemeState} onChange={e => setSchemeState(e.target.value)}>
                            <option value="Uttar Pradesh">Uttar Pradesh</option>
                            <option value="Karnataka">Karnataka</option>
                            <option value="Punjab">Punjab</option>
                            <option value="Maharashtra">Maharashtra</option>
                            <option value="West Bengal">West Bengal</option>
                          </select>
                        </div>
                      </div>
                      <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
                        {schemeLoading ? 'SEARCHING GOVT DATABASE...' : 'FIND MY SCHEMES'}
                      </button>
                    </form>
                  </div>

                  {schemeResults && (
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
                      {schemeResults.map((s, idx) => (
                        <div key={idx} className="desi-card" style={{ padding: '2rem' }}>
                          <span className="badge-desi" style={{ marginBottom: '0.5rem', display: 'inline-block' }}>Highly Relevant Scheme</span>
                          <h3 style={{ fontSize: '1.4rem', color: 'var(--color-forest-green-dark)', marginBottom: '0.5rem' }}>{s.name}</h3>
                          <p style={{ fontSize: '0.95rem', color: 'var(--color-charcoal-muted)', marginBottom: '1rem' }}>{s.snippet}</p>
                          <div style={{ background: 'var(--color-cream-surface)', padding: '1rem', borderRadius: 'var(--radius-md)', marginBottom: '1rem' }}>
                            <strong>Key Benefit:</strong> {s.benefits}
                          </div>
                          <a href={s.site} target="_blank" rel="noreferrer" style={{ color: 'var(--color-forest-green)', fontWeight: 800 }}>Visit Official Portal →</a>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* PAGE 6: DASHBOARD */}
              {activeTab === 'dashboard' && (
                <div>
                  <div className="desi-card" style={{ padding: '2rem', marginBottom: '2rem' }}>
                    <span className="badge-desi" style={{ marginBottom: '0.5rem', display: 'inline-block' }}>📋 Digital Farm Notebook</span>
                    <h1 style={{ fontSize: '2.2rem', color: 'var(--color-forest-green-dark)' }}>Namaste, {user ? user.name : 'Farmer'} 👋</h1>
                    <p style={{ color: 'var(--color-charcoal-muted)' }}>Location: Meerut, Uttar Pradesh | Season: Kharif</p>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '1.5rem', marginBottom: '2.5rem' }}>
                    <div className="desi-card" style={{ padding: '1.75rem' }}>
                      <h3 style={{ fontSize: '1.1rem', marginBottom: '0.5rem' }}>🌤️ Local Weather</h3>
                      <p style={{ fontSize: '2.5rem', fontWeight: 800, color: 'var(--color-forest-green-dark)', margin: 0 }}>28°C</p>
                      <p style={{ color: 'var(--color-charcoal-muted)', margin: 0 }}>Partly Cloudy | 68% Humidity</p>
                    </div>

                    <div className="desi-card" style={{ padding: '1.75rem' }}>
                      <h3 style={{ fontSize: '1.1rem', marginBottom: '0.5rem' }}>💡 Today’s Farming Tip</h3>
                      <p style={{ fontSize: '0.9rem', color: 'var(--color-charcoal)' }}>"During humid overcast days, inspect paddy field borders closely for leaf blast signs."</p>
                    </div>
                  </div>
                </div>
              )}

              {/* PAGE 7: ABOUT US */}
              {activeTab === 'about' && (
                <div className="desi-card" style={{ padding: '3rem' }}>
                  <span className="badge-desi" style={{ marginBottom: '0.75rem', display: 'inline-block' }}>Our Purpose</span>
                  <h1 style={{ fontSize: '2.5rem', color: 'var(--color-forest-green-dark)', marginBottom: '1rem' }}>Built For The People Who Grow Our Food.</h1>
                  <p style={{ fontSize: '1.1rem', color: 'var(--color-charcoal-muted)', lineHeight: 1.7 }}>
                    AgriSaarthi bridges traditional field wisdom with verified agricultural science. Designed cleanly for Indian farmers with multi-language support.
                  </p>
                </div>
              )}

              {/* PAGE 8: HELP */}
              {activeTab === 'help' && (
                <div className="desi-card" style={{ padding: '3rem' }}>
                  <h1 style={{ fontSize: '2.2rem', color: 'var(--color-forest-green-dark)', marginBottom: '1rem' }}>Need Help?</h1>
                  <p style={{ fontSize: '1.1rem', color: 'var(--color-charcoal)', marginBottom: '2rem' }}>📞 Kisan Call Center (Toll-Free): <strong>1800-180-1551</strong></p>
                </div>
              )}

              {/* PAGE 9: SIGN IN */}
              {activeTab === 'signin' && (
                <div className="desi-card" style={{ padding: '3rem', maxWidth: '480px', margin: '0 auto' }}>
                  <h2 style={{ fontSize: '1.8rem', color: 'var(--color-forest-green-dark)', marginBottom: '0.5rem' }}>Sign In to AgriSaarthi</h2>
                  <p style={{ fontSize: '0.9rem', color: 'var(--color-charcoal-muted)', marginBottom: '1.5rem' }}>Access your personalized digital farm notebook.</p>
                  <form onSubmit={e => { e.preventDefault(); setUser({ name: 'Ramesh Kumar' }); setActiveTab('dashboard'); }}>
                    <div style={{ marginBottom: '1rem' }}>
                      <label style={{ fontWeight: 700, display: 'block', marginBottom: '0.35rem' }}>Email / Phone Number</label>
                      <input type="text" className="form-input" defaultValue="ramesh.farmer@agrisaarthi.in" required />
                    </div>
                    <div style={{ marginBottom: '1.5rem' }}>
                      <label style={{ fontWeight: 700, display: 'block', marginBottom: '0.35rem' }}>Password</label>
                      <input type="password" className="form-input" defaultValue="••••••••" required />
                    </div>
                    <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>SIGN IN</button>
                  </form>
                </div>
              )}
            </div>

            {/* Footer */}
            <footer style={{ background: 'var(--color-cream-surface)', borderTop: '1px solid var(--color-cream-border)', padding: '2.5rem', marginTop: 'auto' }}>
              <div style={{ maxWidth: '1200px', margin: '0 auto', display: 'flex', flexWrap: 'wrap', justify: 'space-between', gap: '1.5rem' }}>
                <div>
                  <h3 style={{ color: 'var(--color-forest-green-dark)', marginBottom: '0.5rem' }}>🌾 AgriSaarthi</h3>
                  <p style={{ fontSize: '0.9rem', color: 'var(--color-charcoal-muted)' }}>"Technology for Every Farmer. Built with farmers in mind."</p>
                </div>
                <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                  {LANGUAGES.map(l => (
                    <button key={l.code} onClick={() => setLang(l.code)} style={{ padding: '0.35rem 0.75rem', background: 'white', border: '1px solid var(--color-cream-border)', borderRadius: '4px', fontSize: '0.85rem', fontWeight: 700 }}>
                      {l.native}
                    </button>
                  ))}
                </div>
              </div>
            </footer>
          </main>

          {/* Equal 5-Language Selector Modal */}
          {isLangOpen && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100 }} onClick={() => setIsLangOpen(false)}>
              <div style={{ background: 'white', borderRadius: 'var(--radius-lg)', padding: '2rem', width: '90%', maxWidth: '440px' }} onClick={e => e.stopPropagation()}>
                <h2 style={{ fontSize: '1.35rem', marginBottom: '1rem' }}>🌐 Choose Language / भाषा चुनें</h2>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                  {LANGUAGES.map(l => (
                    <button key={l.code} onClick={() => { setLang(l.code); setIsLangOpen(false); }} style={{
                      padding: '0.85rem 1.25rem', borderRadius: 'var(--radius-md)', border: lang === l.code ? '2px solid var(--color-forest-green)' : '1px solid var(--color-cream-border)',
                      background: lang === l.code ? 'var(--color-leaf-light)' : 'white', textAlign: 'left', fontWeight: 700, fontSize: '1.1rem'
                    }}>
                      {l.native} ({l.code.toUpperCase()})
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
